<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
<style>
    .mauDo{
        font-size: 100%;
        color: red;
    }
    .mauXanh{
        font-size: 100%;
        color: green;
    }
    [class*="col-"]{
        padding-right: 0;
        padding-left: 0;
    }
    li{
        width: 150px;

    }
    #form1{
        height: 640px;

    }
    #checkbox{
        width: 15px;
        height: 15px;
    }

</style>
<script>
    $(document).ready(function(){
        var i=2;
        $("#btnDK").click(function(){
            $("#myModal").modal();
        })

        function kiemTraMa(){
            var mauKT=/^([0]{1}[0-9]{1})([0-9]{7})$/;
            var maValue=$("#txtMa").val();
            if(maValue==""){
                $("#tbMa").html("Bat buoc nhap");
                $("#tbMa").addClass("mauDo");
                $("#tbMa").removeClass("mauXanh");
                return false;
            } else if (!mauKT.test(maValue)){
                $("#tbMa").html("Nhap sai, 2 so dau phai la nam sinh vi du 0");
                $("#tbMa").addClass("mauDo");
                $("#tbMa").removeClass("mauXanh");
                return false;
            } else{
                $("#tbMa").html("Nhap dung roi");
                $("#tbMa").addClass("mauXanh");
                $("#tbMa").removeClass("mauDo");
                return true;
            }
        }
        $("#txtMa").blur(kiemTraMa);

        function kiemTraHT(){
            var regex=/(^[A-Z]{1}[a-z])(\s[A-Z]{1}[a-z]*)+$/;
            var hoten=$("#txtHT").val();
            if(hoten==""){
                $("#tbTen").html("Vui long nhap lai");
                $("#tbTen").addClass("mauDo");
                $("#tbTen").removeClass("mauXanh");
                return false;
            } else if (regex.test(hoten)==false){
                $("#tbTen").html("Ho ten toi thieu 2 tu va Hoa dau theo mau: Nguyen Van Anh");
                $("#tbTen").addClass("mauDo");
                $("#tbTen").removeClass("mauXanh");
                return false;
            } else {
                $("#tbTen").html("Nhap Dung roi");
                $("#tbTen").addClass("mauXanh");
                $("#tbTen").removeClass("mauDo");
                return true;

            }
        };
        $("#txtHT").blur(kiemTraHT);

        function kiemTraDC(){
            var regex=/^.{3,15}@iuh.edu.vn$/;
            var diachi=$("#txtDC").val();
            if(diachi==""){
                $("#tbDC").html("Bat buoc nhap");
                $("#tbDC").addclass("mauDo");
                $("#tbDC").removeclass("mauXanh");
                return false;
            } else if (!regex.test(diachi)){
                $("#tbDC").html("Nhap sai");
                $("#tbDC").addClass("mauDo");
                $("#tbDC").removeClass("mauXanh");
                return false;
            } else {
                $("#tbDC").html("Nhap Dung roi");
                $("#tbDC").addClass("mauXanh");
                $("#tbDC").removeClass("mauDo");
                return true;
            }
        }
        $("#txtDC").blur(kiemTraDC);

        $("#slGia").change(function(){
            var tienDV=$("#slGia option:selected").val();
            $("#txtDV").val(tienDV);
            var tong=tienDV;
            $("#txtTong").val(tong);
        });

        $(".chkDoDung").click(function(){
            var tienDD=0;
            $(".chkDoDung:checked").each(function(){
                tienDD += parseFloat($(this).val());
            });
            $("#txtDD").val(tienDD);
            var tong = parseFloat($("#txtDD").val()) + parseFloat($("#txtDV").val());
                $("#txtTong").val(tong);

        });
        $("#btnSave").click(function() {
                var ma = $("#txtMa").val();
                var ht = $("#txtHT").val();
                var dc = $("#txtDC").val();
                var tdv = $("#txtDV").val();
                var tdd = $("#txtDD").val();
                var tong = $("#txtTong").val();
                var them = "<tr><td>" + (i++) + "</td><td>" + ma + "</td><td>" + ht + "</td><td>" + dc + "</td><td>" +
                    tdv + "</td><td>" + tdd + "</td><td>" + tong + "</td><td>";
                $("#tbDanhSach").append(them);
                $("#myModal").modal("hide");
            
        });
    });
</script>
</head>
<body>
    <div class="container border">
        <div class="row">
            <div calss="col-12">

                        <div class="modal-body">

                                <div class="row form-group p-1">

                                    </div>
                                    <div class="col-3 col-sm-3 p-2">
                                        <span id="tbTen">*</span>

                                    </div>

                                </div>

                                    <div class="col-4 col-sm-3">

                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtDV" id="txtDV" class="form-control" disabled>
                                    </div>
                              
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="">Do dung:</label>

                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for=""></label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="checkbox" name="chkDoDung" class="chkDoDung" value="50000" id="checkbox">Phao
                                    </div>

                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for=""></label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="checkbox" name="chkDoDung" class="chkDoDung" value="70000" id="checkbox">Kinh boi
                                    </div>
                                </div>
                                <div class=" row p-1">
                                    <div class="col-4 col-sm-4">
                                        <label for="">Tien do dung</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtDD" id="txtDD" class="form-control" disabled>
                                    </div>
                                </div>
                                <br>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="">Tong Tien</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtTong" id="txtTong" class="form-control" disabled>
                                    </div>
                                </div>
                                <br>
                                <div class="row p-1">
                                    <div class="col-sm-6">
                                        <input type="button" value="Thanh Toan" id="btnSave" class="btn btn-success btn-block ">
                                    </div>
                                    <div class="col-sm-6"><input type="reset" value="Huy " class="btn btn-danger btn-block">
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <h4>Trang thanh toan</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-4 col-md-4">
                <h6>Ma Sinh Vien: 22653251</h6>
            </div>

            <div class="col-4 col-md-4">

            </div>
            
            <div class="col-4 col-md-4">

    </div>
</body>
</html>
